name: Deploy LUME HOTEL Staging

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      # Runtime sources only; docs/README edits do not deploy.
      - "themes/lume/index.html"
      - "themes/lume/styles.css"
      - "clients/lume/hotel-config.json"
      - "core-v2/apply_config.py"
      - "core-v2/qa.py"
      - "core-v2/validate_config.py"
      - "core-v2/capture_portfolio.py"
      - "core-v2/requirements.txt"
      - "sales/index.html"
      - "sales/styles.css"
      - "staging/river-hotel/assets/**"
      - ".github/workflows/deploy-river-staging.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lume-hotel-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Config preflight
        run: python3 core-v2/validate_config.py --config clients/lume/hotel-config.json

      - name: Prepare LUME theme
        shell: bash
        run: |
          mkdir -p staging/river-hotel
          cp themes/lume/index.html staging/river-hotel/index.html
          cp themes/lume/styles.css staging/river-hotel/styles.css

      - name: Prepare commercial sales page
        shell: bash
        run: |
          mkdir -p staging/river-hotel/sales
          cp sales/index.html staging/river-hotel/sales/index.html
          cp sales/styles.css staging/river-hotel/sales/styles.css

      - name: Install Hospitality Core v2 dependencies
        run: python3 -m pip install -r core-v2/requirements.txt

      - name: Apply Hospitality Core v2 config
        run: python3 core-v2/apply_config.py --config clients/lume/hotel-config.json --html staging/river-hotel/index.html --css staging/river-hotel/styles.css

      - name: Hospitality Core v2 QA
        run: python3 core-v2/qa.py --config clients/lume/hotel-config.json --html staging/river-hotel/index.html --css staging/river-hotel/styles.css

      - name: Static QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('staging/river-hotel')
          html = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'styles.css').read_text(encoding='utf-8')
          combined = html + '\n' + css

          expected_assets = [
              'assets/lume-hero.webp',
              'assets/lume-room.webp',
              'assets/lume-breakfast.webp',
              'assets/lume-business.webp',
              'assets/lume-city.webp',
              'assets/lume-wifi-qr.svg',
          ]

          checks = {
              'core v2 title': 'Hospitality Core v2' in html,
              'external stylesheet': 'styles.css' in html and '<style' not in html,
              'mobile polish marker': 'LUME v2.4 Mobile Polish' in css,
              'viewport meta': 'width=device-width' in html,
              '44px touch targets': 'min-height:44px' in css,
              'selected assets referenced': all(a in combined for a in expected_assets),
              'selected asset files exist': all((root / a).exists() for a in expected_assets),
              'no Pexels placeholders': 'images.pexels.com' not in combined,
              'language switch': 'class="lang-float"' in html and 'data-lang="en"' in html,
              'maps': html.count('google.com/maps/search') == 3,
              'copy controls': 'data-copy="9"' in html and 'wifi-pass' in html,
              'wifi QR': 'assets/lume-wifi-qr.svg' in html and 'wifi-ssid' in html and 'DEMO-ONLY-2026' in html,
              'wifi same-phone fallback': '正用同一支手機看本頁？' in html,
              'city disclosure': 'AI 情境示意' in html,
              'journal removed': 'id="journal"' not in html and 'href="#journal"' not in html,
              'guest copy cleaned': '正式版本可放入' not in html and '依實際館規設定' not in html and '依實際服務時段設定' not in html,
              'no RIVER': 'RIVER HOTEL' not in html,
          }

          for key, value in checks.items():
              print(('PASS' if value else 'FAIL'), key)

          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Commercial page QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('staging/river-hotel/sales')
          html = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'styles.css').read_text(encoding='utf-8')

          checks = {
              'sales html exists': (root / 'index.html').exists(),
              'sales css exists': (root / 'styles.css').exists(),
              'sales title': 'LUME Digital Guest Guide' in html,
              'mobile viewport': 'width=device-width' in html,
              'early partner price': 'NT$12,800' in html,
              'standard price': 'NT$19,800' in html,
              'care price': 'NT$6,000 / 年' in html,
              'demo link': 'href="../"' in html,
              'scope boundary': '不是無上限客製網站' in html,
              'responsive css': '@media(max-width:520px)' in css,
          }

          for key, value in checks.items():
              print(('PASS' if value else 'FAIL'), key)

          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Install Chromium for portfolio capture
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chromium

      - name: Capture real mobile portfolio sections
        shell: bash
        run: |
          python3 core-v2/capture_portfolio.py \
            --html staging/river-hotel/index.html \
            --output staging/river-hotel/portfolio-captures

      - name: Portfolio capture QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('staging/river-hotel/portfolio-captures')
          expected = ['02-room.png','03-breakfast.png','04-city.png','05-wifi.png','06-stay.png']
          for name in expected:
              p = root / name
              if not p.exists():
                  raise SystemExit(f'FAIL missing portfolio capture: {name}')
              with Image.open(p) as im:
                  w, h = im.size
                  print('PASS', name, w, h)
                  if w < 800 or h < 500:
                      raise SystemExit(f'FAIL low-resolution capture: {name} {w}x{h}')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging/river-hotel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
