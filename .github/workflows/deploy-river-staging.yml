name: Deploy LUME HOTEL Staging

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "staging/river-hotel/**"
      - ".github/workflows/deploy-river-staging.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lume-hotel-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble LUME v2.3 artifact
        shell: bash
        run: |
          cat staging/river-hotel/.v23/part*.txt | base64 -d | gzip -d > staging/river-hotel/index.html

      - name: Apply selected LUME visual set
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('staging/river-hotel/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            r'https://images\.pexels\.com/photos/37734643/[^"\']+': 'assets/lume-room.webp',
            r'https://images\.pexels\.com/photos/4916557/[^"\']+': 'assets/lume-breakfast.webp',
            r'https://images\.pexels\.com/photos/9574509/[^"\']+': 'assets/lume-business.webp',
          }
          for pattern, replacement in replacements.items():
              s, count = re.subn(pattern, replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'Expected exactly one replacement for {pattern}, got {count}')

          visual_css = r'''
          /* Selected LUME visual set — guest-approved demo imagery */
          .hero{
            background:
              linear-gradient(90deg,rgba(255,250,246,.95) 0%,rgba(255,250,246,.84) 34%,rgba(255,250,246,.34) 63%,rgba(255,250,246,.08) 100%),
              url('assets/lume-hero.webp') 62% center/cover no-repeat !important;
          }
          .hero:after{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,250,246,.10)) !important}
          .hero-inner{max-width:1040px}
          .hero-inner>p,.hero-inner>small{max-width:540px}
          .city-photo img{min-height:210px;max-height:420px;object-position:center}
          @media(max-width:759px){
            .hero{
              background:
                linear-gradient(180deg,rgba(255,250,246,.94) 0%,rgba(255,250,246,.80) 45%,rgba(255,250,246,.28) 100%),
                url('assets/lume-hero.webp') 62% center/cover no-repeat !important;
            }
            .city-photo img{min-height:170px;max-height:260px}
          }
          '''
          s = s.replace('</style>', visual_css + '</style>', 1)

          city_figure = '''<figure class="photo-block city-photo"><img src="assets/lume-city.webp" alt="城市河濱散步情境示意" loading="lazy" decoding="async"><figcaption data-zh="城市河濱散步情境示意 · AI-generated demo visual" data-en="Urban riverside walk · AI-generated demo visual">城市河濱散步情境示意 · AI-generated demo visual</figcaption></figure>'''
          if 'assets/lume-city.webp' not in s:
              s = s.replace('<div class="city-grid">', city_figure + '<div class="city-grid">', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Static QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('staging/river-hotel')
          s = (root / 'index.html').read_text(encoding='utf-8')
          expected_assets = [
            'assets/lume-hero.webp',
            'assets/lume-room.webp',
            'assets/lume-breakfast.webp',
            'assets/lume-business.webp',
            'assets/lume-city.webp',
          ]
          checks = {
            'v2.3 title': 'Real Hospitality Demo v2.3' in s,
            'selected assets referenced': all(a in s for a in expected_assets),
            'selected asset files exist': all((root / a).exists() for a in expected_assets),
            'no Pexels placeholders': 'images.pexels.com' not in s,
            'language switch': 'class="lang-float"' in s and 'data-lang="en"' in s,
            'maps': s.count('google.com/maps/search') == 3,
            'copy controls': 'data-copy="9"' in s and 'wifi-pass' in s,
            'city disclosure': 'AI-generated demo visual' in s,
            'no RIVER': 'RIVER HOTEL' not in s,
          }
          for k, v in checks.items():
              print(('PASS' if v else 'FAIL'), k)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging/river-hotel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
