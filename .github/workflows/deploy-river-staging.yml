name: Deploy LUME HOTEL Staging

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "staging/river-hotel/**"
      - ".github/workflows/deploy-river-staging.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lume-hotel-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble LUME v2.5 artifact
        shell: bash
        run: |
          cat staging/river-hotel/.v25/part*.txt | base64 -d | gzip -d > staging/river-hotel/index.html

      - name: Static QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('staging/river-hotel')
          s = (root / 'index.html').read_text(encoding='utf-8')
          expected_assets = [
            'assets/lume-hero.webp',
            'assets/lume-room.webp',
            'assets/lume-breakfast.webp',
            'assets/lume-business.webp',
            'assets/lume-city.webp',
          ]
          checks = {
            'v2.5 title': 'Real Hospitality Demo v2.5' in s,
            'mobile polish marker': 'LUME v2.4 Mobile Polish' in s,
            'viewport meta': 'width=device-width' in s,
            '44px touch targets': 'min-height:44px' in s,
            'selected assets referenced': all(a in s for a in expected_assets),
            'selected asset files exist': all((root / a).exists() for a in expected_assets),
            'no Pexels placeholders': 'images.pexels.com' not in s,
            'language switch': 'class="lang-float"' in s and 'data-lang="en"' in s,
            'maps': s.count('google.com/maps/search') == 3,
            'copy controls': 'data-copy="9"' in s and 'wifi-pass' in s,
            'city disclosure': 'AI 情境示意' in s,
            'journal removed': 'id=\"journal\"' not in s and 'href=\"#journal\"' not in s,\n            'guest copy cleaned': '正式版本可放入' not in s and '依實際館規設定' not in s and '依實際服務時段設定' not in s,\n            'no RIVER': 'RIVER HOTEL' not in s,
          }
          for k, v in checks.items():
              print(('PASS' if v else 'FAIL'), k)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging/river-hotel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
