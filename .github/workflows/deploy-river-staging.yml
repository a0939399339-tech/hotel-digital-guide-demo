name: Deploy LUME HOTEL Staging

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "staging/river-hotel/**"
      - ".github/workflows/deploy-river-staging.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lume-hotel-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble LUME v2.3 artifact
        shell: bash
        run: |
          cat staging/river-hotel/.v23/part*.txt | base64 -d | gzip -d > staging/river-hotel/index.html

      - name: Static QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('staging/river-hotel/index.html').read_text(encoding='utf-8')
          checks={
            'v2.3 title':'Real Hospitality Demo v2.3' in s,
            '3 real-photo refs':s.count('images.pexels.com')==3,
            'language switch':'class="lang-float"' in s and 'data-lang="en"' in s,
            'maps':s.count('google.com/maps/search')==3,
            'copy controls':'data-copy="9"' in s and 'wifi-pass' in s,
            'no RIVER':'RIVER HOTEL' not in s,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          if not all(checks.values()): raise SystemExit(1)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging/river-hotel

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
